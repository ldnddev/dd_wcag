[package]
name = "ldnddev_theme"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Shared YAML theme load/save and live color editor for ldnddev TUI apps"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
